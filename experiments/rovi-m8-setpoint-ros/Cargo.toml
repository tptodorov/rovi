[package]
name = "rovi-m8-setpoint-ros"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "M8: setpoint protocol, single owner, optional ROS 2 (host-tested core)"

[[bin]]
name = "rovi-m8-setpoint-ros"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(target_arch = "xtensa")'.dependencies]
embassy-executor = "0.10.0"
embassy-futures = "0.1.1"
embassy-time = "0.5.0"
embassy-net = { version = "0.8.0", features = ["udp", "proto-ipv4", "medium-ethernet"] }
heapless = "0.9.1"
embassy-sync = "0.8.0"
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-hal = { version = "1.2.2", features = ["esp32s3", "unstable"] }
esp-hal-smartled = { version = "0.18.0", features = ["esp32s3"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32s3", "ble", "wifi", "coex", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["esp32s3", "esp-radio", "esp-alloc", "embassy"] }
esp-println = { version = "0.18.0", features = ["esp32s3"] }
smart-leds = "0.4.0"
static_cell = "2.1.1" # Required by trouble-host GATT derive.
trouble-host = { version = "0.8.0", features = ["peripheral", "gatt", "derive"] }

[profile.dev.package.esp-radio]
opt-level = 3

[profile.release.package.esp-radio]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true

[dependencies]
libm = "0.2"
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }

# The optional ROS 2 sim adapter runs the zenoh-nostd fork (liveliness tokens, sample attachments).
zenoh-nostd = { git = "https://github.com/tptodorov/zenoh-nostd", rev = "4ec6181", features = ["alloc", "log"], optional = true }
zenoh-std = { git = "https://github.com/tptodorov/zenoh-nostd", rev = "4ec6181", optional = true }
embassy-executor = { version = "0.9.1", features = ["arch-std", "executor-thread"], optional = true }
embassy-futures = { version = "0.1.2", optional = true }
embassy-sync = { version = "0.7.2", optional = true }
embassy-time = { version = "0.5.0", features = ["std"], optional = true }
static_cell = { version = "2.1.1", optional = true }
env_logger = { version = "0.11", optional = true }

[features]
ros = ["dep:zenoh-nostd", "dep:zenoh-std", "dep:embassy-executor", "dep:embassy-futures", "dep:embassy-sync", "dep:embassy-time", "dep:static_cell", "dep:env_logger"]
