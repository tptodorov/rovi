[package]
name = "rovi-m8-setpoint-ros"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "M8: setpoint protocol, single owner, optional ROS 2 (host-tested core)"

[dependencies]
libm = "0.2"
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }

# The optional ROS 2 sim adapter runs the zenoh-nostd fork (liveliness tokens, sample attachments).
zenoh-nostd = { git = "https://github.com/tptodorov/zenoh-nostd", rev = "b853f72", features = ["alloc", "log"], optional = true }
zenoh-std = { git = "https://github.com/tptodorov/zenoh-nostd", rev = "b853f72", optional = true }
embassy-executor = { version = "0.9.1", features = ["arch-std", "executor-thread"], optional = true }
embassy-futures = { version = "0.1.2", optional = true }
embassy-sync = { version = "0.7.2", optional = true }
embassy-time = { version = "0.5.0", features = ["std"], optional = true }
static_cell = { version = "2.1.1", optional = true }
env_logger = { version = "0.11", optional = true }

[features]
ros = ["dep:zenoh-nostd", "dep:zenoh-std", "dep:embassy-executor", "dep:embassy-futures", "dep:embassy-sync", "dep:embassy-time", "dep:static_cell", "dep:env_logger"]
