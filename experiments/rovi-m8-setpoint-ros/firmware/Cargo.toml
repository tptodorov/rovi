[package]
name = "rovi-m8-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "M8: board-only ESP32-S3 firmware shell around the host-tested core"

[[bin]]
name = "rovi-m8-firmware"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(target_arch = "xtensa")'.dependencies]
rovi-m8-setpoint-ros = { path = ".." }
embassy-executor = "0.10.0"
embassy-futures = "0.1.1"
embassy-time = "0.5.0"
embassy-net = { version = "0.8.0", features = ["udp", "proto-ipv4", "medium-ethernet"] }
heapless = "0.9.1"
embassy-sync = "0.8.0"
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-hal = { version = "1.2.2", features = ["esp32s3", "unstable"] }
esp-hal-smartled = { version = "0.18.0", features = ["esp32s3"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32s3", "ble", "wifi", "coex", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["esp32s3", "esp-radio", "esp-alloc", "embassy"] }
esp-println = { version = "0.18.0", features = ["esp32s3"] }
smart-leds = "0.4.0"
static_cell = "2.1.1" # Required by trouble-host GATT derive.
trouble-host = { version = "0.8.0", features = ["peripheral", "gatt", "derive"] }

# Optional ROS 2 over zenoh-nostd (the tptodorov fork), on embassy-net.
zenoh-nostd = { git = "https://github.com/tptodorov/zenoh-nostd", rev = "e1267a8", default-features = false, features = ["alloc"], optional = true }
zenoh-embassy = { git = "https://github.com/tptodorov/zenoh-nostd", rev = "e1267a8", optional = true }
getrandom = { version = "0.2", features = ["custom"], optional = true }

[features]
ros = ["dep:zenoh-nostd", "dep:zenoh-embassy", "dep:getrandom"]

[profile.dev.package.esp-radio]
opt-level = 3

[profile.release.package.esp-radio]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
