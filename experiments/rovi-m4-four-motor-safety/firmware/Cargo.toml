[package]
name = "rovi-m4-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "M4: four-motor bench firmware shell around the host-tested core (draft, never flashed)"

[[bin]]
name = "rovi-m4-firmware"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(target_arch = "xtensa")'.dependencies]
rovi-m4-four-motor-safety = { path = ".." }
critical-section = "1.2"
embassy-executor = "0.10.0"
embassy-futures = "0.1.1"
embassy-sync = "0.8.0"
embassy-time = "0.5.0"
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-hal = { version = "1.2.2", features = ["esp32s3", "unstable"] }
esp-hal-smartled = { version = "0.18.0", features = ["esp32s3"] }
esp-println = { version = "0.18.0", features = ["esp32s3"] }
esp-rtos = { version = "0.4.0", features = ["esp32s3", "embassy"] }
smart-leds = "0.4.0"

[profile.release]
opt-level = "s"
lto = true
