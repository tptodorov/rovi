<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 592" width="904" height="592" font-family="Helvetica, Arial, sans-serif">
<title>Crimping</title>
<rect width="904" height="592" fill="#ffffff"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D00000"/></marker></defs>
<text x="16.0" y="38.0" font-size="20" text-anchor="start" font-weight="bold" fill="#222" >Crimping a JST-SM terminal (open-barrel, two-stage crimp)</text>
<rect x="16" y="60" width="280" height="250" rx="10" fill="#fafafa" stroke="#bbb"/>
<text x="28.0" y="84.0" font-size="15" text-anchor="start" font-weight="bold" fill="#222" >1. Strip 2-2.5 mm</text>
<path d="M46,180 L186,180" stroke="#D00000" stroke-width="12"/>
<path d="M186,180 L231,180" stroke="#c87533" stroke-width="5"/>
<line x1="186" y1="155" x2="186" y2="205" stroke="#666" stroke-dasharray="4,3"/>
<line x1="231" y1="155" x2="231" y2="205" stroke="#666" stroke-dasharray="4,3"/>
<text x="208.0" y="150.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >2-2.5 mm</text>
<text x="28.0" y="282.0" font-size="12" text-anchor="start" font-weight="normal" fill="#333" >Bare copper fills the conductor wings only.</text>
<text x="28.0" y="298.0" font-size="12" text-anchor="start" font-weight="normal" fill="#333" ></text>
<rect x="312" y="60" width="280" height="250" rx="10" fill="#fafafa" stroke="#bbb"/>
<text x="324.0" y="84.0" font-size="15" text-anchor="start" font-weight="bold" fill="#222" >2. Terminal in the die</text>
<rect x="352" y="130" width="200" height="90" rx="8" fill="#555"/>
<rect x="372" y="160" width="40" height="24" fill="#999"/>
<rect x="422" y="160" width="40" height="24" fill="#999"/>
<rect x="472" y="160" width="40" height="24" fill="#999"/>
<rect x="424" y="166" width="36" height="10" fill="#d4b04a"/>
<text x="442.0" y="210.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#fff" >pick the slot that closes the wings</text>
<text x="324.0" y="282.0" font-size="12" text-anchor="start" font-weight="normal" fill="#333" >Wings up, in the smallest slot that closes</text>
<text x="324.0" y="298.0" font-size="12" text-anchor="start" font-weight="normal" fill="#333" >both wing pairs (match your wire gauge).</text>
<rect x="608" y="60" width="280" height="250" rx="10" fill="#fafafa" stroke="#bbb"/>
<text x="620.0" y="84.0" font-size="15" text-anchor="start" font-weight="bold" fill="#222" >3. Wire in, squeeze fully</text>
<rect x="668" y="174" width="40" height="12" rx="2" fill="#d4b04a" stroke="#9a7a20"/>
<rect x="638" y="178" width="30" height="4" fill="#d4b04a"/>
<path d="M723,172 l12,-8 M723,188 l12,8" stroke="#9a7a20" stroke-width="3"/>
<path d="M748,170 l14,-10 M748,190 l14,10" stroke="#9a7a20" stroke-width="3"/>
<rect x="718" y="176" width="50" height="8" fill="#d4b04a"/>
<text x="726.0" y="158.0" font-size="9" text-anchor="end" font-weight="normal" fill="#222" >conductor</text>
<text x="752.0" y="158.0" font-size="9" text-anchor="start" font-weight="normal" fill="#222" >insulation</text>
<text x="868.0" y="184.0" font-size="11" text-anchor="end" font-weight="normal" fill="#222" >pin</text>
<path d="M778,180 L868,180" stroke="#D00000" stroke-width="10"/>
<text x="620.0" y="282.0" font-size="12" text-anchor="start" font-weight="normal" fill="#333" >Ratchet until it releases. Copper under the</text>
<text x="620.0" y="298.0" font-size="12" text-anchor="start" font-weight="normal" fill="#333" >conductor wings, insulation under the others.</text>
<rect x="16" y="326" width="280" height="250" rx="10" fill="#fafafa" stroke="#bbb"/>
<text x="28.0" y="350.0" font-size="15" text-anchor="start" font-weight="bold" fill="#222" >4. Check the crimp</text>
<rect x="56" y="406" width="60" height="14" rx="3" fill="#d4b04a"/>
<rect x="116" y="408" width="30" height="10" fill="#c87533"/>
<rect x="146" y="404" width="30" height="18" rx="4" fill="#b88a2a"/>
<path d="M176,413 L266,413" stroke="#D00000" stroke-width="10"/>
<text x="166.0" y="451.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#20A020" >✔ good</text>
<rect x="56" y="476" width="60" height="14" rx="3" fill="#d4b04a"/>
<path d="M116,483 L266,483" stroke="#D00000" stroke-width="10"/>
<text x="166.0" y="516.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#c00" >✘ insulation in the conductor wings</text>
<text x="28.0" y="548.0" font-size="12" text-anchor="start" font-weight="normal" fill="#333" >Wings rolled tight, copper visible at both</text>
<text x="28.0" y="564.0" font-size="12" text-anchor="start" font-weight="normal" fill="#333" >ends; a firm tug must not pull it out.</text>
<rect x="312" y="326" width="280" height="250" rx="10" fill="#fafafa" stroke="#bbb"/>
<text x="324.0" y="350.0" font-size="15" text-anchor="start" font-weight="bold" fill="#222" >5. Into the housing</text>
<rect x="362" y="396" width="62" height="40" rx="4" fill="#f2f2f2" stroke="#888"/>
<rect x="370" y="406" width="18" height="20" fill="#ccc"/>
<rect x="376" y="436" width="6" height="18" fill="#d4b04a"/>
<rect x="396" y="406" width="18" height="20" fill="#ccc"/>
<rect x="402" y="436" width="6" height="18" fill="#d4b04a"/>
<path d="M402,526 L402,466" stroke="#D00000" stroke-width="4" marker-end="url(#arr)"/>
<text x="324.0" y="548.0" font-size="12" text-anchor="start" font-weight="normal" fill="#333" >Barb toward the latch window; push until it</text>
<text x="324.0" y="564.0" font-size="12" text-anchor="start" font-weight="normal" fill="#333" >clicks. It must not pull back out.</text>
<rect x="608" y="326" width="280" height="250" rx="10" fill="#fafafa" stroke="#bbb"/>
<text x="620.0" y="350.0" font-size="15" text-anchor="start" font-weight="bold" fill="#222" >6. Mate and test</text>
<rect x="638" y="386" width="62" height="40" rx="4" fill="#f2f2f2" stroke="#888"/>
<rect x="646" y="396" width="18" height="20" fill="#ccc"/>
<rect x="652" y="426" width="6" height="18" fill="#d4b04a"/>
<rect x="672" y="396" width="18" height="20" fill="#ccc"/>
<rect x="678" y="426" width="6" height="18" fill="#d4b04a"/>
<rect x="661.0" y="378" width="16" height="8" fill="#ddd" stroke="#888"/>
<text x="669.0" y="498.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" >pin side</text>
<rect x="740" y="386" width="62" height="40" rx="4" fill="#f2f2f2" stroke="#888"/>
<rect x="748" y="396" width="18" height="20" fill="#555"/>
<rect x="774" y="396" width="18" height="20" fill="#555"/>
<rect x="761.0" y="376" width="20" height="10" fill="#f2f2f2" stroke="#888"/>
<text x="771.0" y="498.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" >socket side</text>
<path d="M655,444 L655,484" stroke="#D00000" stroke-width="3"/>
<path d="M757,426 L757,466" stroke="#D00000" stroke-width="3"/>
<path d="M681,444 L681,484" stroke="#202020" stroke-width="3"/>
<path d="M783,426 L783,466" stroke="#202020" stroke-width="3"/>
<text x="620.0" y="548.0" font-size="12" text-anchor="start" font-weight="normal" fill="#333" >Click the halves together. Check polarity</text>
<text x="620.0" y="564.0" font-size="12" text-anchor="start" font-weight="normal" fill="#333" >with a multimeter before plugging power.</text>
</svg>
