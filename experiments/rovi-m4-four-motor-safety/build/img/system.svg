<text x="710.0" y="495.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >4 motors via 2-pin JST plugs</text>
<text x="16.0" y="420.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222" >Kill switch: unplug the motor</text>
