<text x="780.0" y="240.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#fff" >ESP32</text>
<path d="M670,140 L720,140 M670,155 L720,155 M670,170 L720,170 M670,185 L720,185 M670,200 L720,200" stroke="#ffcc00" stroke-width="2"/>
<path d="M670,260 L720,260 M670,275 L720,275 M670,290 L720,290 M670,305 L720,305 M670,320 L720,320" stroke="#ffcc00" stroke-width="2"/>
