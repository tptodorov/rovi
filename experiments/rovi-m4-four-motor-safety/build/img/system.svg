<text x="125.0" y="305.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#222" >ESP32</text>
<text x="125.0" y="328.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" >power bank</text>
<path d="M220,135 L340,135" stroke="#222" stroke-width="8"/>
