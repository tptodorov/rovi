<path d="M600,430 L600,380" stroke="#3A9A3A" stroke-width="4"/>
<rect x="645" y="430" width="60" height="40" rx="6" fill="#f0d000"/>
<text x="675.0" y="455.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222" >RL</text>
<path d="M675,430 L675,380" stroke="#3A9A3A" stroke-width="4"/>
<rect x="720" y="430" width="60" height="40" rx="6" fill="#f0d000"/>
