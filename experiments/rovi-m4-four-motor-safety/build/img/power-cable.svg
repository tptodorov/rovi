<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="Helvetica, Arial, sans-serif">
<title>Motor power cable</title>
<rect width="880" height="290" fill="#ffffff"/>
<text x="16.0" y="36.0" font-size="20" text-anchor="start" font-weight="bold" fill="#222" >Motor power cable and the carrier's power-in pigtail</text>
<rect x="30" y="90" width="80" height="44" rx="4" fill="#bbb" stroke="#666"/>
<text x="70.0" y="117.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222" >USB-A</text>
<path d="M110,112 L300,112" stroke="#222" stroke-width="10"/>
<text x="205.0" y="98.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >~30 cm, outer jacket stripped 4 cm</text>
<path d="M300,112 L420,92" stroke="#D00000" stroke-width="5"/>
<path d="M300,112 L420,132" stroke="#202020" stroke-width="5"/>
<path d="M300,112 L350,150 M300,112 L345,160" stroke="#20A020" stroke-width="3"/>
<path d="M345,160 L352,152" stroke="#20A020" stroke-width="3"/>
<rect x="338" y="145" width="18" height="22" rx="3" fill="#222" opacity="0.6"/>
<text x="360.0" y="182.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" >data wires: cut short, heat-shrink each</text>
<rect x="420" y="76" width="64" height="74" rx="5" fill="#f2f2f2" stroke="#888"/>
<rect x="420" y="84" width="14" height="14" fill="#555"/>
<text x="442.0" y="96.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222" >1</text>
<rect x="420" y="106" width="14" height="14" fill="#ddd"/>
<text x="442.0" y="118.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" >2 empty</text>
<rect x="420" y="128" width="14" height="14" fill="#555"/>
<text x="442.0" y="140.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222" >3</text>
<circle cx="478" cy="84" r="6" fill="#D00000"/>
<text x="452.0" y="172.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222" >3-pin SOCKET side</text>
<text x="452.0" y="188.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >red = 1, black = 3</text>
<path d="M500,113 L540,113" stroke="#888" stroke-width="2" stroke-dasharray="4,3"/>
<text x="520.0" y="104.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#222" >click</text>
<rect x="540" y="76" width="64" height="74" rx="5" fill="#f2f2f2" stroke="#888"/>
<rect x="604" y="86" width="16" height="8" fill="#d4b04a"/>
<rect x="604" y="130" width="16" height="8" fill="#d4b04a"/>
<circle cx="548" cy="84" r="6" fill="#D00000"/>
<text x="572.0" y="172.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222" >3-pin PIN side</text>
<text x="572.0" y="188.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >(carrier pigtail)</text>
<path d="M620,90 L760,90" stroke="#D00000" stroke-width="5"/>
<path d="M620,134 L760,134" stroke="#202020" stroke-width="5"/>
<rect x="760" y="60" width="90" height="100" fill="#D9B77A"/>
<text x="805.0" y="178.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >carrier</text>
<text x="805.0" y="105.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" >VM (4,25)</text>
<text x="805.0" y="125.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" >GND (2,25)</text>
<text x="16.0" y="230.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222" >1. Plug the USB-A end into the motor power bank and MEASURE which wire carries +5 V (usually red). Unplug.</text>
<text x="16.0" y="250.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222" >2. Pin 1 = +5 V (red), pin 3 = GND (black), pin 2 empty, on both halves. Mark pin 1 with a red dot.</text>
<text x="16.0" y="270.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222" >3. The 3-pin plug cannot mate with a 2-pin motor plug, and the keyed housing only fits one way round.</text>
</svg>
