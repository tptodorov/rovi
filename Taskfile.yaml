version: "3"

tasks:
  m1:build:
    desc: "M1 (rovi-m1-tb6612): cargo build --release"
    dir: experiments/rovi-m1-tb6612
    cmds:
      - cargo build --release

  m1:flash:
    desc: "M1 (rovi-m1-tb6612): flash + serial monitor via espflash"
    dir: experiments/rovi-m1-tb6612
    cmds:
      - cargo run --release

  m8:test:
    desc: "M8: core unit tests and the car-log parser tests"
    dir: experiments/rovi-m8-setpoint-ros
    cmds:
      - cargo test --lib
      - python3 -m unittest discover -s sim -p 'test_*.py'

  m8:bench:
    desc: "M8: sim bench run (UDP scenarios + car log check) into bench/sim-<time>/; see docs/FEEDBACK-LOOPS.md"
    dir: experiments/rovi-m8-setpoint-ros
    cmds:
      - cd sim/simcar && cargo build
      - sim/bench.sh

  worktree:prepare:
    desc: Prepare a fresh worktree (install third-party skills from skills-lock.json)
    sources:
      - skills-lock.json
    generates:
      - .agents/skills/**/*
      - .claude/skills
    method: checksum
    cmds:
      - npx -y skills experimental_install -y
      - mkdir -p .claude
      - ln -sfn ../.agents/skills .claude/skills
