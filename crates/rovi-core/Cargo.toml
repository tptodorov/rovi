[package]
name = "rovi-core"
# The version is part of the `ev=boot ver=` log line; keep it in step with the event tests.
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Rovi device core: setpoint codecs, arbiter, kinematics, graph and device (host-tested no_std)"

[dependencies]
libm = "0.2"
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }
