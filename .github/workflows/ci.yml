name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  openspec:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run spec:check
      - run: npm run spec:reader:check
      - run: npm run openspec -- validate --archived --strict --no-interactive

  host:
    name: host tests (cores, sim car, Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            experiments/rovi-m8-setpoint-ros
            experiments/rovi-m8-setpoint-ros/sim/simcar
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install bleak matplotlib numpy
      - name: M8 core
        working-directory: experiments/rovi-m8-setpoint-ros
        run: |
          cargo fmt --check
          (cd firmware && RUSTUP_TOOLCHAIN=stable cargo fmt --check)  # the directory pins the esp toolchain
          (cd sim/simcar && cargo fmt --check)
          cargo test --locked --lib
          cargo clippy --locked --lib --tests -- -D warnings
      - name: M8 sim car (with and without ROS)
        working-directory: experiments/rovi-m8-setpoint-ros/sim/simcar
        run: |
          cargo build --locked --features ros
          cargo build --locked
      - name: M8 UDP scenarios against the sim car
        working-directory: experiments/rovi-m8-setpoint-ros
        run: python3 sim/udp_scenarios.py
      - name: Python unit tests
        env:
          MPLBACKEND: Agg
        run: |
          (cd experiments/rovi-m8-setpoint-ros/sim && python3 -m unittest test_wire test_carlog test_latency test_plot_car test_compare_track test_ble_client)
          (cd experiments/rovi-m3-wifi-queue && python3 -m unittest test_client)
      - name: M4 carrier matches the schematic; build-guide images are up to date
        run: |
          python3 experiments/rovi-m4-four-motor-safety/build/gen_build_guide.py --check
          git diff --exit-code experiments/rovi-m4-four-motor-safety/build

  ros-sim:
    name: ROS 2 scenarios (sim car, rmw_zenohd in docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/rovi-m8-setpoint-ros/sim/simcar
      - name: Sim car with ROS
        working-directory: experiments/rovi-m8-setpoint-ros/sim/simcar
        run: cargo build --locked --features ros
      - name: ROS scenarios (stock pub drives, controller, intruder, latched stop, round trip)
        working-directory: experiments/rovi-m8-setpoint-ros
        run: sim/ros-scenarios.sh
      - name: Router frozen and resumed (TCP rejoins)
        working-directory: experiments/rovi-m8-setpoint-ros
        run: sim/ros-router-gone.sh 10000 tcp

  firmware:
    name: firmware (ESP32-S3)
    runs-on: ubuntu-latest
    env:
      ROVI_WIFI_PASSWORD: ci-not-a-real-password
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        env:
          # espup queries the GitHub API; anonymous calls hit the rate limit (403).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          buildtargets: esp32s3
          version: 1.97.0.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            experiments/rovi-m8-setpoint-ros/firmware
      - name: M8 firmware
        working-directory: experiments/rovi-m8-setpoint-ros/firmware
        run: |
          cargo clippy --locked --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc -- -D warnings
          cargo build --locked --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc
      - name: M8 firmware with ROS
        working-directory: experiments/rovi-m8-setpoint-ros/firmware
        env:
          CARGO_TARGET_DIR: target/ros
        run: |
          cargo clippy --locked --release --features ros --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc -- -D warnings
          cargo build --locked --release --features ros --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc
