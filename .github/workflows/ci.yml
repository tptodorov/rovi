name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  openspec:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run spec:check
      - run: npm run spec:reader:check
      - run: npm run openspec -- validate --archived --strict --no-interactive

  iphone:
    name: iPhone web controller (Node, Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/iphone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/iphone/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: ROVI_IPHONE_DIST=1 npm run test:browser

  host:
    name: host tests (cores, sim car, Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            experiments/rovi-m8-setpoint-ros
            experiments/rovi-m8-setpoint-ros/sim/simcar
            .
            apps/simcar
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install bleak matplotlib numpy
      - name: M8 core
        working-directory: experiments/rovi-m8-setpoint-ros
        run: |
          cargo fmt --check
          (cd firmware && RUSTUP_TOOLCHAIN=stable cargo fmt --check)  # the directory pins the esp toolchain
          (cd sim/simcar && cargo fmt --check)
          cargo test --locked --lib
          cargo clippy --locked --lib --tests -- -D warnings
      - name: M8 sim car (with and without ROS)
        working-directory: experiments/rovi-m8-setpoint-ros/sim/simcar
        run: |
          cargo build --locked --features ros
          cargo build --locked
      - name: M8 UDP scenarios against the sim car
        working-directory: experiments/rovi-m8-setpoint-ros
        run: python3 sim/udp_scenarios.py
      - name: Product crates (rovi-core, rovi-motor-control, rovi-drive)
        run: |
          cargo fmt --all --check
          (cd apps/simcar && cargo fmt --check)
          (cd firmware && RUSTUP_TOOLCHAIN=stable cargo fmt --check)  # the directory pins the esp toolchain
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked -p rovi-drive --features motor-bench
          cargo clippy --locked -p rovi-drive --features motor-bench --all-targets -- -D warnings
      - name: Product sim car (with and without ROS)
        working-directory: apps/simcar
        run: |
          cargo clippy --locked --features ros -- -D warnings
          cargo clippy --locked -- -D warnings
          cargo build --locked --features ros
          cargo build --locked
      - name: Product motor bench simulator (separate binary)
        working-directory: apps/simcar
        env:
          CARGO_TARGET_DIR: target/motor-bench
        run: |
          cargo clippy --locked --features motor-bench -- -D warnings
          cargo build --locked --features motor-bench
      - name: Product UDP scenarios against the sim car
        run: python3 apps/simcar/scenarios/udp_scenarios.py
      - name: Network-mode scenarios against the sim car (UDP and virtual BLE)
        run: python3 apps/simcar/scenarios/network_scenarios.py
      - name: Python unit tests
        env:
          MPLBACKEND: Agg
        run: |
          (cd apps/simcar/scenarios && python3 -m unittest test_wire test_carlog test_latency)
          python3 -m unittest discover -s firmware/bench -p 'test_*.py'
          python3 -m unittest discover -s apps/teleop/tests -t .
          (cd experiments/rovi-m8-setpoint-ros/sim && python3 -m unittest test_wire test_carlog test_latency test_plot_car test_compare_track test_ble_client)
          (cd experiments/rovi-m3-wifi-queue && python3 -m unittest test_client)
      - name: M4 carrier matches the schematic; build-guide images are up to date
        run: |
          python3 experiments/rovi-m4-four-motor-safety/build/gen_build_guide.py --check
          git diff --exit-code experiments/rovi-m4-four-motor-safety/build

  ros-sim:
    name: ROS 2 scenarios (sim car, rmw_zenohd in docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            experiments/rovi-m8-setpoint-ros/sim/simcar
            apps/simcar
      - name: Sim car with ROS
        working-directory: experiments/rovi-m8-setpoint-ros/sim/simcar
        run: cargo build --locked --features ros
      - name: ROS scenarios (stock pub drives, controller, intruder, latched stop, round trip)
        working-directory: experiments/rovi-m8-setpoint-ros
        run: sim/ros-scenarios.sh
      - name: Router frozen and resumed (TCP rejoins)
        working-directory: experiments/rovi-m8-setpoint-ros
        run: sim/ros-router-gone.sh 10000 tcp
      - name: Product sim car with ROS
        working-directory: apps/simcar
        run: cargo build --locked --features ros
      - name: Product ROS scenarios
        run: apps/simcar/scenarios/ros-scenarios.sh
      - name: Product capabilities/status (late subscriber, shared errors, release, reconnect)
        run: apps/simcar/scenarios/ros-capabilities.sh
      - name: Product router frozen and resumed (TCP rejoins)
        run: apps/simcar/scenarios/ros-router-gone.sh 10000 tcp
      - name: Product router reconnect (three cycles)
        run: apps/simcar/scenarios/ros-reconnect.sh
      - name: Product missed-liveliness recovery (negative and positive controls)
        run: apps/simcar/scenarios/ros-refresh.sh
      - name: Product stale UDP router session recovery
        run: apps/simcar/scenarios/ros-stale-session.sh
      - name: Product network mode across ROS, UDP and virtual BLE (takeover, hand-back, mode, release)
        run: apps/simcar/scenarios/ros-network.sh
      - name: Transport conformance suite (same rules over UDP, virtual BLE and ROS)
        run: apps/simcar/scenarios/conformance.sh
      - name: Product router reconnect in home mode (mode unchanged)
        env:
          ROVI_SIM_HOME: "1"
        run: apps/simcar/scenarios/ros-reconnect.sh
      - name: Product read-only board probe (loopback)
        run: |
          log=$(mktemp)
          ROVI_ZENOH_ROUTER=tcp/127.0.0.1:17449 apps/simcar/target/debug/simcar 17796 >"$log" 2>&1 &
          car=$!
          trap 'kill "$car" 2>/dev/null || true; wait "$car" 2>/dev/null || true; rm -f "$log"' EXIT
          ROVI_TARGET=127.0.0.1:17796 ROVI_CARLOG="$log" ROVI_ROUTER_PORT=17449 \
            bash firmware/bench/ros_readonly.sh
      - name: Product ROS motor board probe (loopback only)
        run: |
          log=$(mktemp)
          ROVI_ZENOH_ROUTER=tcp/127.0.0.1:17450 apps/simcar/target/debug/simcar 17797 >"$log" 2>&1 &
          car=$!
          trap 'kill "$car" 2>/dev/null || true; wait "$car" 2>/dev/null || true; rm -f "$log"' EXIT
          ROVI_CARLOG="$log" ROVI_ROUTER_PORT=17450 bash firmware/bench/ros_stops.sh
      - name: Product ROS router-loss board probe (loopback only)
        run: |
          log=$(mktemp)
          ROVI_ZENOH_ROUTER=tcp/127.0.0.1:17451 apps/simcar/target/debug/simcar 17798 >"$log" 2>&1 &
          car=$!
          trap 'kill "$car" 2>/dev/null || true; wait "$car" 2>/dev/null || true; rm -f "$log"' EXIT
          ROVI_CARLOG="$log" ROVI_ROUTER_PORT=17451 bash firmware/bench/ros_router_loss.sh
      - name: Product UDP/ROS shared-AP board probe (loopback only)
        run: |
          log=$(mktemp)
          ROVI_ZENOH_ROUTER=tcp/127.0.0.1:17452 apps/simcar/target/debug/simcar 17799 >"$log" 2>&1 &
          car=$!
          trap 'kill "$car" 2>/dev/null || true; wait "$car" 2>/dev/null || true; rm -f "$log"' EXIT
          ROVI_TARGET=127.0.0.1:17799 ROVI_CARLOG="$log" ROVI_ROUTER_PORT=17452 \
            bash firmware/bench/ros_stops.sh ros_udp_sharing.py
      - name: Product ROS lease timing board probe (loopback only)
        run: |
          log=$(mktemp)
          ROVI_ZENOH_ROUTER=tcp/127.0.0.1:17453 apps/simcar/target/debug/simcar 17800 >"$log" 2>&1 &
          car=$!
          trap 'kill "$car" 2>/dev/null || true; wait "$car" 2>/dev/null || true; rm -f "$log"' EXIT
          ROVI_CARLOG="$log" ROVI_ROUTER_PORT=17453 \
            bash firmware/bench/ros_stops.sh ros_lease_timing.py
      - name: Idle ROS Wi-Fi observation (loopback only)
        run: |
          log=$(mktemp)
          work=$(mktemp -d)
          output=$work/probe
          ROVI_ZENOH_ROUTER=tcp/127.0.0.1:17454 apps/simcar/target/debug/simcar 17801 >"$log" 2>&1 &
          car=$!
          trap 'kill "$car" 2>/dev/null || true; wait "$car" 2>/dev/null || true; rm -f "$log"; rm -rf "$work"' EXIT
          for _ in $(seq 50); do
            grep -q 'ev=boot' "$log" && break
            sleep 0.1
          done
          ROVI_TARGET=127.0.0.1:17801 ROVI_CARLOG="$log" ROVI_ROUTER_PORT=17454 \
            bash firmware/bench/ros_wifi_soak.sh lo 2 "$output"

  firmware:
    name: firmware (ESP32-S3)
    runs-on: ubuntu-latest
    env:
      ROVI_WIFI_PASSWORD: ci-not-a-real-password
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        env:
          # espup queries the GitHub API; anonymous calls hit the rate limit (403).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          buildtargets: esp32s3
          version: 1.97.0.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            experiments/rovi-m8-setpoint-ros/firmware
            firmware
      - name: M8 firmware
        working-directory: experiments/rovi-m8-setpoint-ros/firmware
        run: |
          cargo clippy --locked --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc -- -D warnings
          cargo build --locked --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc
      - name: M8 firmware with ROS
        working-directory: experiments/rovi-m8-setpoint-ros/firmware
        env:
          CARGO_TARGET_DIR: target/ros
        run: |
          cargo clippy --locked --release --features ros --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc -- -D warnings
          cargo build --locked --release --features ros --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc
      - name: Product firmware
        working-directory: firmware
        run: |
          cargo clippy --locked --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc -- -D warnings
          cargo build --locked --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc
      - name: Product firmware with ROS
        working-directory: firmware
        env:
          CARGO_TARGET_DIR: target/ros
        run: |
          cargo clippy --locked --release --features ros --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc -- -D warnings
          cargo build --locked --release --features ros --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc
      - name: Product firmware with ROS and home settings (build only; placeholder values)
        working-directory: firmware
        env:
          CARGO_TARGET_DIR: target/home
          ROVI_HOME_SSID: ci-home
          ROVI_HOME_PASSWORD: ci-placeholder
          ROVI_HOME_ROUTER: tcp/192.0.2.10:7447
        run: |
          cargo clippy --locked --release --features ros --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc -- -D warnings
          cargo build --locked --release --features ros --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc
          # The home passphrase is only for the station config: never formatted, logged or served.
          uses=$(grep -n "HOME_PASSWORD" src/*.rs | grep -v -e "option_env!" -e "netmode::settings" -e "panic!" -e "ROVI_HOME_PASSWORD must")
          test "$(echo "$uses" | wc -l)" = 1 && echo "$uses" | grep -q "Wpa2Personal\|unwrap_or(\"\").try_into" || { echo "unexpected HOME_PASSWORD use: $uses"; exit 1; }
      - name: Product reversal bench firmware with ROS (build only)
        working-directory: firmware
        env:
          CARGO_TARGET_DIR: target/reversal-bench
        run: |
          cargo clippy --locked --release --features ros,motor-bench --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc -- -D warnings
          cargo build --locked --release --features ros,motor-bench --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc
